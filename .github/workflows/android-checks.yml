name: Android checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine check scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tests/CheckScopeTest.py
          python3 tests/RemoteConfigChecksTest.py
          echo "scope=$(python3 tests/CheckScope.py)" >> "$GITHUB_OUTPUT"
      - name: Validate configuration-only change
        if: steps.scope.outputs.scope == 'config'
        run: |
          python3 tests/RemoteConfigChecks.py
          python3 tests/WebsiteChecks.py
          node tests/WebsiteDownloadChecks.cjs
      - name: Validate documentation-only change
        if: steps.scope.outputs.scope == 'docs'
        run: git diff --check "$BASE_SHA" "$HEAD_SHA" --
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@v4
        if: steps.scope.outputs.scope != 'config' && steps.scope.outputs.scope != 'docs'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        if: steps.scope.outputs.scope != 'config' && steps.scope.outputs.scope != 'docs'
      - name: Prepare verified Gradle distribution
        if: steps.scope.outputs.scope != 'config' && steps.scope.outputs.scope != 'docs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/PrepareGradle.py
      - name: Install Android SDK
        if: steps.scope.outputs.scope != 'config' && steps.scope.outputs.scope != 'docs'
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Business regression checks
        if: steps.scope.outputs.scope != 'config' && steps.scope.outputs.scope != 'docs'
        run: python3 tests/run_checks.py
      - name: Release validation tests
        if: steps.scope.outputs.scope != 'config' && steps.scope.outputs.scope != 'docs'
        run: |
          python3 tests/ReleaseChecksTest.py
      - name: Signing boundaries without official secrets
        if: steps.scope.outputs.scope != 'config' && steps.scope.outputs.scope != 'docs'
        run: python3 tests/SigningChecks.py
      - name: Build and test QA application
        if: steps.scope.outputs.scope != 'config' && steps.scope.outputs.scope != 'docs'
        run: |
          sh gradlew --no-daemon -PqaBuild :app:assembleLiteDebug :app:assembleLiteDebugAndroidTest :app:testLiteDebugUnitTest :app:lintLiteDebug
      - name: Upload QA APKs
        if: steps.scope.outputs.scope != 'config' && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@v4
        with:
          name: courselens-qa-${{ github.sha }}
          path: |
            app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test APK and lint reports
        if: always() && steps.scope.outputs.scope != 'config' && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@v4
        with:
          name: courselens-checks-${{ github.sha }}
          path: |
            app/build/outputs/apk/androidTest/*/debug/*.apk
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/tests/test*DebugUnitTest/**
            app/build/test-results/test*DebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
